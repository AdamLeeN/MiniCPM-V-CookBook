# LiveKit 服务器配置 - Windows 原生运行
# 本地开发模式 (127.0.0.1)
port: 7880
log_level: info

# WebRTC配置
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # 本地模式：禁用外部 IP，使用 127.0.0.1
  use_external_ip: false
  node_ip: "127.0.0.1"

# 房间配置
room:
  max_participants: 10
  empty_timeout: 300

# API密钥配置
keys:
  devkey: secretsecretsecretsecretsecretsecret

# TURN服务器配置
turn:
  enabled: true
  domain: "127.0.0.1"
  udp_port: 7882
  tls_port: 0
  external_tls: false
