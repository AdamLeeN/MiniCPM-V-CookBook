# LiveKit 服务器配置 - Docker 环境
port: 7880
log_level: info

# WebRTC配置
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # 🔧 [公网/Docker 部署必须] 启用外部 IP 探测，对外宣告公网地址
  # 如果此项为 false，LiveKit 只会宣告 127.0.0.1 等内网地址，
  # 导致外网客户端 ICE 连接失败（could not establish pc connection）
  use_external_ip: true
  # 公网 IP（穿透后的地址或云服务器公网 IP）
  node_ip: "117.72.163.123"

# 房间配置
room:
  max_participants: 10
  empty_timeout: 300

# API密钥配置（与 docker-compose.yml 和 dev.yaml 保持一致）
keys:
  devkey: secretsecretsecretsecretsecretsecret

# LiveKit内置TURN服务器配置（帮助穿透NAT，确保前端能连接）
turn:
  enabled: true
  # 公网 IP（穿透后的地址）
  domain: "117.72.163.123"
  # UDP端口
  udp_port: 7882
  # 不使用TLS（本地开发）
  tls_port: 0
  external_tls: false
